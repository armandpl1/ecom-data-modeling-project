# Weekly pull requests to keep dependencies current. CI checks each one
# before it can be merged.
version: 2
updates:
  # Pinned GitHub Actions (updates both the commit SHA and the version comment)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Python dependencies in pyproject.toml / uv.lock
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
