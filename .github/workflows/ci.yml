# CI/CD for the e-commerce data model.
#
#   lint ──┐
#          ├─> dbt (build + test) ─> docs ─> deploy-docs (main only)
#   test ──┘
#   lint ──> slim (pull requests: changed models only, deferring to prod)
#   lint ──> terraform (infra/terraform on an AWS emulator, then checked)
#
# CI (lint, test, dbt, docs) runs on every pull request and every push to main.
# CD (deploy-docs) publishes the dbt docs site to GitHub Pages, only after a
# push to main passes every check.
#
# Security: actions are pinned to full commit SHAs (the version tag is in the
# comment; Dependabot keeps both up to date), the default token is read-only,
# and only the deploy job may write to Pages.

name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per branch or PR at a time; a new push cancels the outdated run.
# Runs on main are never cancelled, so every merge gets a full build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.13.7"
  # Fail instead of silently re-resolving dependencies
  UV_LOCKED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Run pre-commit hooks (ruff, black, flake8, file hygiene)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Unit tests (data generator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Run pytest
        run: uv run pytest --junitxml=reports/pytest.xml

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-report
          path: reports/pytest.xml
          retention-days: 14

  dbt:
    name: dbt build and test
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Generate raw data (deterministic)
        run: uv run python scripts/generate_raw_data.py

      - name: Load the extracts into the raw layer (append-only, logged)
        run: uv run python scripts/load_raw.py

      - name: Parse project (fails fast on broken refs or YAML)
        run: uv run dbt parse

      - name: Build models and run all data and unit tests
        run: uv run dbt build

      - name: Check the service-level objectives (ops/slos.yml)
        # Freshness is measured against the latest load (the sample data is
        # static); fails on any breach, and every breach names its runbook.
        run: |
          mkdir -p target
          uv run python scripts/check_slos.py --json target/slo_report.json

      - name: Publish Gold as Apache Iceberg tables and check them
        # Writes data/lakehouse (Parquet + Iceberg metadata, SQLite catalog),
        # then reads every table back with DuckDB's iceberg extension: each
        # must equal its Gold table row for row. A rerun must change nothing.
        run: |
          make iceberg
          make iceberg | tee target/iceberg_rerun.txt
          if grep -E ' (created|updated) ' target/iceberg_rerun.txt; then
            echo "::error::Rerunning the Iceberg publish changed tables"
            exit 1
          fi
          make check-iceberg

      - name: Validate the semantic layer and export its metrics
        # MetricFlow checks every semantic model and metric against the built
        # warehouse, then the dashboard's datasets are exported as CSV.
        run: make metrics

      - name: Check incremental runs match a full refresh
        # Two simulated nightly loads, built incrementally and as a full
        # refresh into separate warehouses: every Gold table must be identical
        run: uv run python scripts/check_incremental.py

      - name: Check early-arriving facts (unknown members)
        # Load everything but one customer, build: their facts must point to
        # the unknown member and warn. Load the customer, build incrementally:
        # every row re-pointed, and Gold equal to a full rebuild.
        run: uv run python scripts/check_late_dimensions.py

      - name: Run the daily pipeline end to end with Dagster
        # Same steps as above, orchestrated: generate, load (a rerun, so it must
        # skip every extract), then dbt build with all tests as asset checks.
        run: make pipeline

      - name: Generate docs site
        run: uv run dbt docs generate --static

      # Run results and logs make a failed build debuggable without rerunning
      - name: Upload dbt artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbt-artifacts
          path: |
            target/run_results.json
            target/slo_report.json
            target/iceberg_rerun.txt
            target/manifest.json
            dashboard/sources/metrics/*.csv
            target/catalog.json
            logs/dbt.log
          if-no-files-found: warn
          retention-days: 14

      # Prod is built only here, on main. Slim CI on pull requests defers
      # to this warehouse and manifest (the "prod-state" artifact).
      - name: Build the prod warehouse and save its state (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p prod-state
          uv run python scripts/load_raw.py --database prod-state/ecom_prod.duckdb
          ECOM_PROD_DUCKDB_PATH=prod-state/ecom_prod.duckdb \
            uv run dbt build --target prod --target-path target/prod
          cp target/prod/manifest.json prod-state/

      - name: Upload prod state for slim CI (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prod-state
          path: prod-state/
          if-no-files-found: error
          retention-days: 30

      - name: Prepare docs site
        run: |
          mkdir -p site
          cp target/static_index.html site/index.html

      - name: Upload docs site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 14

  # Infrastructure as code: the S3 buckets, KMS key and pipeline role in
  # infra/terraform, applied to Moto (an AWS emulator, no account) and
  # checked. Not a required check.
  terraform:
    name: Terraform (AWS emulator)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      moto:
        image: motoserver/moto:5.2.5
        ports:
          - 15000:5000
    env:
      AWS_ENDPOINT_URL: http://localhost:15000
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Format and validate
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -input=false
          terraform -chdir=infra/terraform validate

      - name: Security scan (Trivy, fails on any finding)
        run: |
          docker run --rm -v "$PWD/infra/terraform:/src" aquasec/trivy:0.67.2 \
            config --quiet --exit-code 1 /src

      - name: Apply to the emulator; a second plan must show no changes
        run: |
          terraform -chdir=infra/terraform apply -auto-approve -input=false
          # Moto ignores tags sent with CreateBucket; a second apply sets them
          terraform -chdir=infra/terraform apply -auto-approve -input=false
          terraform -chdir=infra/terraform plan -detailed-exitcode -input=false

      - name: Check the resources are safe, and uploads are idempotent
        run: |
          uv run python scripts/check_infra.py
          uv run python scripts/generate_raw_data.py
          uv run python scripts/upload_extracts.py
          uv run python scripts/upload_extracts.py | tee target_upload.txt
          grep -q "^0 of " target_upload.txt

  # Slim CI: build only the models a pull request changed, plus everything
  # downstream, and read every unchanged model from the prod warehouse
  # built on main (dbt build --select state:modified+ --defer). Not a
  # required check: the full dbt job above still gates merges.
  slim:
    name: dbt slim CI (changed models)
    if: github.event_name == 'pull_request'
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read  # download the prod-state artifact from a main run
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Download the latest prod state from main
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch main --event push --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" --name prod-state --dir prod-state; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using prod state from main run $run_id"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No prod-state artifact on main yet; slim CI skipped (the full dbt job still runs)"
          fi

      - name: Build what changed, deferring to prod
        if: steps.state.outputs.found == 'true'
        run: |
          mkdir -p target
          uv run python scripts/generate_raw_data.py
          uv run python scripts/load_raw.py --database target/ci.duckdb
          uv run dbt build --target ci --select state:modified+ --defer --state prod-state \
            | tee target/slim_build.txt
          {
            echo "### Slim CI"
            grep -E "Done\.|Nothing to do" target/slim_build.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload slim CI artifacts
        if: ${{ !cancelled() && steps.state.outputs.found == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slim-ci
          path: |
            target/run_results.json
            target/slim_build.txt
            logs/dbt.log
          if-no-files-found: warn
          retention-days: 14

  deploy-docs:
    name: Deploy docs to GitHub Pages
    needs: dbt
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
