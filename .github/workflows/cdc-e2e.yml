# CDC end to end: the live stack (Postgres -> Debezium Server -> Redpanda)
# against the CSV path. See scripts/check_cdc_e2e.py and README,
# "Change data capture".
#
# Not part of the main CI/CD workflow and not a required check: it pulls about
# 2.5 GB of images, so it runs only when CDC code changes, weekly (to catch
# drift in the pinned images), or by hand.

name: CDC end to end

on:
  pull_request:
    paths:
      - "cdc/**"
      - "scripts/cdc_*.py"
      - "scripts/check_cdc_e2e.py"
      - "models/staging/**"
      - ".github/workflows/cdc-e2e.yml"
  schedule:
    - cron: "0 9 * * 1" # Mondays, 09:00 UTC
  workflow_dispatch:

concurrency:
  group: cdc-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.7"
  UV_LOCKED: "1"
  FORCE_COLOR: "1"

jobs:
  cdc-e2e:
    name: CDC end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Start the CDC stack (waits until every service is healthy)
        run: docker compose -f cdc/docker-compose.yml up -d --wait

      - name: Check CDC against the CSV path, exactly once, and a schema change
        run: uv run python scripts/check_cdc_e2e.py --json target/cdc_e2e_report.json

      - name: Save container logs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p target
          docker compose -f cdc/docker-compose.yml logs --no-color > target/cdc_stack.log 2>&1

      - name: Upload the report and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cdc-e2e
          path: |
            target/cdc_e2e_report.json
            target/cdc_stack.log
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose -f cdc/docker-compose.yml down -v
