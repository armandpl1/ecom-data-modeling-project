version: 2

sources:
  - name: raw
    description: >
      Append-only raw layer in DuckDB (schema `raw`). scripts/load_raw.py
      appends each nightly extract from data/raw/ and records the load in
      raw._load_log, so every load is kept and none is applied twice. Every
      change to a record is a new row; nothing is edited in place. All
      columns are text and the staging models cast them. Each row also has
      _ingested_at, _batch_id and _file_name, saying which load it came from.
    config:
      # Loads run nightly, so data older than ~1.5 days means a missed load.
      # The bundled sample data is static and will report as stale.
      loaded_at_field: "cast(_loaded_at as timestamp)"
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: customers
        description: Customer profile changes.
        columns:
          - name: customer_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]
          - name: _op
            description: I insert, U update, D delete.
            data_tests:
              - accepted_values:
                  arguments:
                    values: [I, U, D]
          - name: _loaded_at
            data_tests: [not_null]

      - name: products
        description: Product catalog changes (price, active flag).
        columns:
          - name: product_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]
          - name: _op
            data_tests:
              - accepted_values:
                  arguments:
                    values: [I, U, D]

      - name: orders
        description: Order header changes (status, payment, total). The products are in order_lines.
        columns:
          - name: order_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]
          - name: _op
            data_tests:
              - accepted_values:
                  arguments:
                    values: [I, U, D]

      - name: _load_log
        description: >
          One row per extract loaded by scripts/load_raw.py: batch id, target
          table, file name, row count, SHA-256 and load time. A file whose
          checksum is already logged is skipped, which makes reloads safe.
        config:
          freshness: null
        columns:
          - name: batch_id
            data_tests: [not_null, unique]
          - name: table_name
            data_tests:
              - accepted_values:
                  arguments:
                    values: [customers, products, orders, order_lines, subscriptions]
          - name: sha256
            data_tests: [not_null]
          - name: row_count
            data_tests: [not_null]

      - name: order_lines
        description: >
          Order line changes: one product per line, 1-5 lines per order,
          loaded with the header change they belong to. A line can be
          returned on its own (line_status = returned).
        columns:
          - name: order_line_id
            data_tests: [not_null]
          - name: order_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]
          - name: _op
            data_tests:
              - accepted_values:
                  arguments:
                    values: [I, U, D]

      - name: subscriptions
        description: Subscription changes (plan, status, MRR).
        columns:
          - name: subscription_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]
          - name: _op
            data_tests:
              - accepted_values:
                  arguments:
                    values: [I, U, D]
