version: 2

sources:
  - name: raw
    description: >
      Append-only nightly extracts from the source system, written to data/raw/
      by scripts/generate_raw_data.py. Every change to a record is a new row.
      All columns are read as text; the staging models cast them.
    meta:
      external_location: "read_csv('data/raw/{name}.csv', header = true, all_varchar = true)"
    tables:
      - name: customers
      - name: products
      - name: orders
      - name: subscriptions
