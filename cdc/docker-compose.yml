# CDC stack: PostgreSQL (source system) -> Debezium Server -> Redpanda (Kafka API).
# scripts/cdc_source.py writes changes into Postgres; scripts/cdc_consumer.py
# reads the topics and appends to the raw layer in DuckDB.
#
#   make cdc-up     start the stack (waits until healthy)
#   make cdc-down   stop it and delete its volumes
#
# Memory is capped so the stack fits on a laptop: about 1.6 GB at most.

name: ecom-cdc

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
      POSTGRES_DB: source
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=4
      - -c
      - max_replication_slots=4
      # A local replay: durability of each commit isn't needed, speed is
      - -c
      - synchronous_commit=off
    ports:
      - "15432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      # Over TCP: during first-time init, Postgres runs init.sql on a
      # temporary socket-only server, which a socket check would call ready
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ecom -d source"]
      interval: 2s
      timeout: 3s
      retries: 30

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda:/var/lib/redpanda/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 3s
      timeout: 5s
      retries: 40

  debezium:
    image: quay.io/debezium/server:2.7.3.Final
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m"
    volumes:
      - ./debezium/application.properties:/debezium/conf/application.properties:ro
      - debezium:/debezium/data
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/q/health/ready | grep -q UP"]
      interval: 3s
      timeout: 5s
      retries: 60

volumes:
  pgdata:
  redpanda:
  debezium:
