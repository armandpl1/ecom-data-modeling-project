name: ecom
version: "1.0.0"
profile: ecom

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Calendar range for dim_date
  date_spine_start: "2024-01-01"
  date_spine_end: "2026-12-31"

models:
  ecom:
    # Bronze: cleaned, typed, deduplicated copies of the raw extracts
    staging:
      +schema: bronze
      +materialized: view
    # Silver: business logic, joins and SCD Type 2 history
    intermediate:
      +schema: silver
      +materialized: table
    # Gold: dimensional models for business use
    marts:
      +schema: gold
      +materialized: table
