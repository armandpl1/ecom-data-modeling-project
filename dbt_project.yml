name: ecom
version: "1.0.0"
profile: ecom

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Calendar range for dim_date
  date_spine_start: "2024-01-01"
  date_spine_end: "2026-12-31"
  # First month of the fiscal year (2 = February, common in retail).
  # Fiscal years are named by the calendar year they end in.
  fiscal_year_start_month: 2
  # Reference date for rolling-window flags in dim_date. Leave unset to use
  # the last order date in the data.
  as_of_date: null
  # Incremental facts recompute rows whose inputs were ingested in the latest
  # load round or this many hours before it. Covers late data and a few
  # missed runs; beyond that, run `dbt build --full-refresh`.
  incremental_lookback_hours: 72

# Unity Catalog governance (Databricks only; no-ops on DuckDB)
on-run-start:
  - "{{ create_pii_mask_function() }}"
on-run-end:
  - "{{ grant_read_access() }}"

models:
  ecom:
    # Bronze: cleaned, typed, deduplicated copies of the raw extracts
    # (incremental tables: each model sets materialized='incremental')
    staging:
      +schema: bronze
      +materialized: view
    # Silver: business logic, joins and SCD Type 2 history
    intermediate:
      +schema: silver
      +materialized: table
    # Gold: dimensional models for business use
    marts:
      +schema: gold
      +materialized: table
      # Reporting: aggregates on the star schema, ready for dashboards
      reporting:
        +schema: reporting

data_tests:
  ecom:
    # Save the failing rows of each test as a view in the test_failures
    # schema, so a failure can be inspected with plain SQL. Not on
    # Databricks (macros/should_store_failures.sql).
    +store_failures: true
    +store_failures_as: view
    +schema: test_failures
