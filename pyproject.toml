[project]
name = "ecom-data-modeling-project"
version = "0.1.0"
description = "Data modeling project for a fictional e-commerce business, built with dbt and DuckDB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.16.2",
    "dagster>=1.13.31",
    "dagster-dbt>=0.29.31",
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
    "dbt-metricflow>=0.16.0",
    "duckdb>=2.0.0",
    "faker>=40.44.0",
    "psycopg[binary]>=3.3.9",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "dagster-webserver>=1.13.31",
    "flake8>=7.5.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "sqlfluff==4.5.0",
    "sqlfluff-templater-dbt==4.5.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
# Python tests for the data generator. (tests/ holds dbt tests.)
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]
