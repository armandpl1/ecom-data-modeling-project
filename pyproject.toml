[project]
name = "ecom-data-modeling-project"
version = "0.1.0"
description = "Data modeling project for a fictional e-commerce business, built with dbt and DuckDB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "faker>=40.44.0",
]

[dependency-groups]
dev = [
    # ruff, mypy, pytest and pre-commit at the versions pinned by the toolkit
    "data-ml-toolkit[dev]",
    "black>=26.10.1",
    "flake8>=7.5.0",
]

[tool.uv]
package = false

# Shared dev tool pins: https://github.com/armandpl1/data-ml-toolkit
[tool.uv.sources]
data-ml-toolkit = { git = "https://github.com/armandpl1/data-ml-toolkit", tag = "v0.1.0" }

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
# Python tests for the data generator. (tests/ holds dbt tests.)
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]
